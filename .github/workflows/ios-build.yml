# Compile l'app sur un Mac de GitHub, sans avoir de Mac soi-même.
# Se lance à chaque envoi sur GitHub, ou à la main (onglet Actions).
# Résultat : Dalil.ipa (non signé), à télécharger en bas de la page du build,
# puis à installer sur l'iPhone avec Sideloadly depuis Windows (voir LISEZMOI.md).
name: Build iOS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Générer le projet Xcode
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Compiler pour le simulateur
        run: |
          xcodebuild -project Dalil.xcodeproj -scheme Dalil \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
      - name: Compiler pour iPhone (sans signature)
        run: |
          xcodebuild -project Dalil.xcodeproj -scheme Dalil -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Dalil.app Payload/
          zip -qry Dalil.ipa Payload
      - name: Mettre Dalil.ipa à télécharger
        uses: actions/upload-artifact@v4
        with:
          name: Dalil-ipa
          path: Dalil.ipa
